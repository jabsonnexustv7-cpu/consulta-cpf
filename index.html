<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Consulta CPF</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 980px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    label { display:block; font-size: 12px; color:#374151; margin-bottom:6px; }
    input, button { padding: 10px; border-radius: 10px; border:1px solid #d1d5db; font-size: 14px; }
    input { min-width: 260px; width: 100%; }
    button { cursor:pointer; }
    .tabs { display:flex; gap:8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab { padding:10px 12px; border:1px solid #d1d5db; border-radius: 999px; background:#fff; cursor:pointer; }
    .tab.active { background:#111827; color:#fff; border-color:#111827; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .muted { color:#6b7280; font-size: 12px; }
    .err { color:#b91c1c; }
    .ok { color:#065f46; }
    .hidden { display:none; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid #d1d5db; border-top-color:#111827; border-radius:50%; animation:spin 1s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg);} }

    /* Caixinhas copiáveis */
    .fieldbox { display:flex; gap:8px; align-items:flex-end; }
    .fieldbox .field { flex: 1; }
    .copybtn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .copybtn:active { transform: translateY(1px); }
    textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      padding: 10px;
      border-radius: 10px;
      border:1px solid #d1d5db;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }
    .topbar { display:flex; align-items:baseline; justify-content:space-between; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h2 style="margin:0;">Consulta por CPF</h2>
      <p class="muted" style="margin:6px 0 0;">Escolha o tipo de consulta, informe o CPF e veja o retorno em campos copiáveis.</p>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-simples" type="button">Consulta simples (sem mãe)</button>
      <button class="tab" id="tab-completa" type="button">Consulta completa (com mãe)</button>
    </div>

    <div class="row">
      <div style="min-width:320px; flex:1;">
        <label for="cpf">CPF</label>
        <input id="cpf" placeholder="Digite o CPF (apenas números ou com pontuação)" />
      </div>

      <div>
        <button id="btn" type="button">Consultar</button>
      </div>

      <div id="status" class="muted"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Resultado</h3>

    <div id="resultEmpty" class="muted">Nenhuma consulta realizada ainda.</div>

    <div id="resultPretty" class="grid hidden"></div>

    <details style="margin-top:12px;">
      <summary class="muted">Ver JSON completo</summary>
      <pre id="resultRaw" style="white-space:pre-wrap; background:#f9fafb; padding:12px; border-radius:10px; border:1px solid #e5e7eb; overflow:auto;"></pre>
    </details>
  </div>

<script>
  // --- Estado ---
  let mode = "simples"; // "simples" | "completa"

  const tabSimples = document.getElementById("tab-simples");
  const tabCompleta = document.getElementById("tab-completa");
  const cpfInput = document.getElementById("cpf");
  const btn = document.getElementById("btn");
  const statusEl = document.getElementById("status");
  const resultPretty = document.getElementById("resultPretty");
  const resultRaw = document.getElementById("resultRaw");
  const resultEmpty = document.getElementById("resultEmpty");

  function setMode(next) {
    mode = next;
    tabSimples.classList.toggle("active", mode === "simples");
    tabCompleta.classList.toggle("active", mode === "completa");
    setStatus("");
    clearResult();
  }

  tabSimples.addEventListener("click", () => setMode("simples"));
  tabCompleta.addEventListener("click", () => setMode("completa"));

  function onlyDigits(s) { return (s || "").toString().replace(/\D+/g, ""); }

  function setStatus(msg, type) {
    statusEl.className = type || "muted";
    statusEl.innerHTML = msg || "";
  }

  function clearResult(){
    resultPretty.innerHTML = "";
    resultPretty.classList.add("hidden");
    resultRaw.textContent = "";
    resultEmpty.classList.remove("hidden");
  }

  // Normaliza o retorno do "simples" e do "completo" para um formato único
  function normalizeResponse(data) {
    const r = data?.result || data?.resultado || {};

    return {
      codigoPessoa: r.codigoPessoa || "",
      nomeCompleto: r.nomeCompleto || r.nome || "",
      genero: r.genero || "",
      dataDeNascimento: r.dataDeNascimento || r.data_de_nascimento || "",
      documento: r.documento || onlyDigits(cpfInput.value) || "",
      nomeDaMae: r.nomeDaMae || "",
      anos: (r.anos ?? ""),
      zodiaco: (r.zodiaco ?? ""),
      listaTelefones: Array.isArray(r.listaTelefones) ? r.listaTelefones : []
    };
  }

  async function copyText(text) {
    const t = (text ?? "").toString();
    try {
      await navigator.clipboard.writeText(t);
      return true;
    } catch {
      // fallback
      const ta = document.createElement("textarea");
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }
  }

  function fieldWithCopy(labelText, value, multiline=false) {
    const wrap = document.createElement("div");
    wrap.className = "fieldbox";

    const field = document.createElement("div");
    field.className = "field";

    const label = document.createElement("label");
    label.textContent = labelText;

    let control;
    if (multiline) {
      control = document.createElement("textarea");
      control.readOnly = true;
      control.value = value ?? "";
    } else {
      control = document.createElement("input");
      control.readOnly = true;
      control.value = value ?? "";
    }

    field.appendChild(label);
    field.appendChild(control);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copybtn";
    btn.textContent = "Copiar";
    btn.addEventListener("click", async () => {
      const ok = await copyText(control.value);
      btn.textContent = ok ? "Copiado ✓" : "Falhou";
      setTimeout(() => (btn.textContent = "Copiar"), 900);
    });

    wrap.appendChild(field);
    wrap.appendChild(btn);
    return wrap;
  }

  function renderPretty(data) {
    const n = normalizeResponse(data);

    // Telefones em linhas
    const phones = (n.listaTelefones || [])
      .map(p => p?.telefoneComDDD)
      .filter(Boolean);

    const phonesText = phones.join("\n");

    resultPretty.innerHTML = "";

    resultPretty.appendChild(fieldWithCopy("Código Pessoa", n.codigoPessoa));
    resultPretty.appendChild(fieldWithCopy("Nome Completo", n.nomeCompleto));
    resultPretty.appendChild(fieldWithCopy("Gênero", n.genero));
    resultPretty.appendChild(fieldWithCopy("Data de Nascimento", n.dataDeNascimento));
    resultPretty.appendChild(fieldWithCopy("Documento (CPF)", n.documento));

    // Você pediu também no simples: então mostramos sempre (no simples vem vazio)
    resultPretty.appendChild(fieldWithCopy("Nome da Mãe", n.nomeDaMae));

    resultPretty.appendChild(fieldWithCopy("Idade (anos)", String(n.anos ?? "")));
    resultPretty.appendChild(fieldWithCopy("Zodíaco", (n.zodiaco ?? "") === null ? "" : String(n.zodiaco ?? "")));

    // Lista de telefones (multilinha)
    resultPretty.appendChild(fieldWithCopy("Lista de Telefones", phonesText, true));

    resultEmpty.classList.add("hidden");
    resultPretty.classList.remove("hidden");
  }

  async function consultar() {
    const cpf = onlyDigits(cpfInput.value);

    if (!cpf || cpf.length !== 11) {
      setStatus("CPF inválido. Informe 11 dígitos.", "err");
      clearResult();
      return;
    }

    btn.disabled = true;
    setStatus('<span class="spinner"></span> Consultando...', "muted");
    clearResult();

    try {
      const url = `/.netlify/functions/consulta?mode=${encodeURIComponent(mode)}&cpf=${encodeURIComponent(cpf)}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        setStatus(data?.error || data?.message || "Falha na consulta.", "err");
        return;
      }

      setStatus("Consulta realizada com sucesso.", "ok");
      renderPretty(data);
      resultRaw.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      setStatus("Erro ao consultar. Verifique se a Function foi publicada no Netlify.", "err");
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", consultar);
  cpfInput.addEventListener("keydown", (e) => { if (e.key === "Enter") consultar(); });

  clearResult();
</script>

</body>
</html>
